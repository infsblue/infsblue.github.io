<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infsblue</title>
    <!-- Using Tailwind CSS for fast responsive layout grids -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="w-full min-h-screen m-0 p-0 font-sans text-gray-800 bg-white">

    <!-- 
      grid-cols-1: 1 column on mobile (stacked)
      md:grid-cols-2: 2 columns on medium screens and larger
      min-h-screen: makes the grid take up the full viewport height 
    -->
    <div class="grid grid-cols-1 md:grid-cols-2 w-full min-h-screen">

        <!-- 1. Logo Section -->
        <div class="flex items-center justify-center p-10 border border-gray-200 bg-gray-50">
            <!-- Placeholder image for the logo -->
            <img src="https://placehold.co/400x200/cbd5e1/334155?text=Logo+Placeholder" alt="Logo Placeholder" class="max-w-full h-auto">
        </div>

        <!-- 2. About Section -->
        <a href="https://www.linkedin.com/company/infsblue/about" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center p-10 border border-gray-200 hover:bg-gray-100 transition-colors group text-decoration-none block">
            <span class="text-3xl font-bold group-hover:underline">About</span>
        </a>

        <!-- 3. Who Section -->
        <a href="https://www.linkedin.com/in/pabloaugustofurtado" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center p-10 border border-gray-200 hover:bg-gray-100 transition-colors group text-decoration-none block">
            <span class="text-3xl font-bold group-hover:underline">Who</span>
        </a>

        <!-- 4. Contact Section -->
        <a href="https://www.linkedin.com/services/page/b681aa347938b7039b" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center p-10 border border-gray-200 hover:bg-gray-100 transition-colors group text-decoration-none block">
            <span class="text-3xl font-bold group-hover:underline">Contact</span>
        </a>

    </div>

</body>
</html>
