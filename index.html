<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfsBlue</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/infsblue_logo.png">

    <!-- Open Graph Meta Tags (for LinkedIn, Facebook, WhatsApp, etc.) -->
    <meta property="og:title" content="InfsBlue">
    <meta property="og:description" content="InfsBlue - About, Contact, and Services.">
    <meta property="og:image" content="https://infsblue.github.io/infsblue_logo.png">
    <meta property="og:url" content="https://infsblue.github.io/">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="InfsBlue">
    <meta name="twitter:description" content="InfsBlue - About, Contact, and Services.">
    <meta name="twitter:image" content="https://infsblue.github.io/infsblue_logo.png">

    <!-- Using Tailwind CSS for fast responsive layout grids -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="w-full min-h-screen m-0 p-0 font-sans text-white bg-[rgba(0,0,0,0.8667)]">

    <!-- 
      grid-cols-1: 1 column on mobile (stacked)
      md:grid-cols-2: 2 columns on medium screens and larger
      min-h-screen: makes the grid take up the full viewport height 
    -->
    <div class="grid grid-cols-1 md:grid-cols-2 w-full min-h-screen">

        <!-- 1. Logo Section (Static, Not a link) -->
        <div class="flex items-center justify-center p-10 border border-white/10">
            <img src="/infsblue_logo.png" alt="InfsBlue Logo" class="w-full h-auto max-w-xs md:max-w-sm">
        </div>

        <!-- 2. About Section -->
        <a href="https://www.linkedin.com/company/infsblue/about" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center p-10 border border-white/10 hover:border-[#00ffff] hover:bg-white/5 transition-all duration-300 group text-decoration-none block">
            <span class="text-3xl font-bold text-white group-hover:text-[#00ffff] transition-colors">About</span>
        </a>

        <!-- 3. Who Section -->
        <a href="https://www.linkedin.com/in/pabloaugustofurtado" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center p-10 border border-white/10 hover:border-[#00ffff] hover:bg-white/5 transition-all duration-300 group text-decoration-none block">
            <span class="text-3xl font-bold text-white group-hover:text-[#00ffff] transition-colors">Who</span>
        </a>

        <!-- 4. Contact Section -->
        <a href="https://www.linkedin.com/services/page/b681aa347938b7039b" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center p-10 border border-white/10 hover:border-[#00ffff] hover:bg-white/5 transition-all duration-300 group text-decoration-none block">
            <span class="text-3xl font-bold text-white group-hover:text-[#00ffff] transition-colors">Services</span>
        </a>

    </div>

</body>
</html>
